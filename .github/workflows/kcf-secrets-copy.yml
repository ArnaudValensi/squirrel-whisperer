# One-off: copy the six macOS signing secrets of this repository to ArnaudValensi/kickcrafter,
# secret to secret, printing nothing. Removed right after its single run.
name: Copy macOS secrets to kickcrafter (one-off)
on:
  workflow_dispatch:
permissions: {}
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy secret to secret
        env:
          GH_TOKEN: ${{ secrets.KCF_SECRETS_PAT }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          for v in MACOS_SIGN_IDENTITY MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD MACOS_NOTARY_APPLE_ID MACOS_NOTARY_TEAM_ID MACOS_NOTARY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::$v is empty in this repository"; exit 1; }
            printf '%s' "${!v}" | gh secret set "$v" --repo ArnaudValensi/kickcrafter
            echo "copied $v (${#v} chars in the name)"
          done
